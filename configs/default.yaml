# PINNs-Bernoulli — master configuration. No magic numbers in code; everything lives here.

seed: 1234
stage: 1                      # 1 = incompressible Bernoulli, 2 = compressible quasi-1D Euler

geometry:
  L: 3.0                      # nozzle length [m]
  D_in: 0.5                   # inlet/outlet diameter [m]
  dt_min: 0.20                # throat diameter range [m]  (parametric design space)
  dt_max: 0.45
  # D(x; Dt) = D_in + (Dt - D_in) * sin^2(pi x / L), throat at x = L/2

physics:
  rho: 1.225                  # density [kg/m^3] (air, incompressible assumption)
  V_in: 10.0                  # inlet velocity [m/s]
  p_in: 101325.0              # inlet pressure [Pa]
  gamma: 1.4                  # stage 2 only
  R: 287.0                    # stage 2 only [J/(kg K)]
  T_in: 300.0                 # stage 2 only [K]

network:
  n_hidden_layers: 6
  n_neurons: 64
  activation: tanh            # tanh | sin
  hard_bc: true               # true: BCs baked into output transform; false: soft penalty loss
  fourier_features: false
  fourier_scale: 2.0
  fourier_n_freqs: 16

loss:
  weighting: annealing        # annealing | fixed   (Wang et al. 2021 learning-rate annealing)
  anneal_every: 500
  anneal_alpha: 0.9           # lambda <- (1-alpha)*lambda + alpha*lambda_hat
  anneal_warmup: 500          # epochs before first annealing update
  lambda_cont: 1.0            # used when weighting: fixed (and as initial values)
  lambda_mom: 1.0
  lambda_bc: 1.0
  lambda_data: 0.0            # stub for future measurement assimilation

training:
  n_collocation_x: 512        # -> n_collocation_x * n_dt_values LHS points
  n_dt_values: 8
  n_boundary: 64              # only used when hard_bc: false
  resample_every: 1000
  adam_epochs: 20000
  adam_lr: 0.001
  lr_decay_gamma: 0.95
  lr_decay_every: 2000
  log_every: 100
  validate_every: 500
  checkpoint_every: 5000
  lbfgs_max_iter: 5000
  lbfgs_history_size: 50
  live_dashboard: false        # true = save learning-dashboard frames during training
  frame_every: 200             # dashboard frame interval [epochs]
  live_display: false          # true = interactive window (your laptop); false = save PNG frames
  # held-out throat diameters [m] used ONLY for validation (never trained on)
  held_out_dt: [0.225, 0.275, 0.325, 0.375, 0.425]

acceptance:                   # the run is only "done" when these pass
  rel_l2_V: 1.0e-3
  rel_l2_p: 1.0e-2
  total_head_tol: 0.01        # |p~ + V~^2 - 1| < 1% everywhere

export:
  n_stations: 201             # axial stations for fields/exports
  n_radial: 64                # radial points for axisymmetric .vtu reconstruction
  sweep_n: 25                 # throat diameters in parametric sweep / .mat export
  plot_dt: [0.20, 0.2833, 0.3667, 0.45]   # D_t values shown in field plots [m]

# Stage 2 — compressible quasi-1D Euler (CLAUDE.md Section 6). Reuses the
# shared `geometry:` and `physics:` blocks above (gamma, R, T_in already
# live there); this block holds everything specific to the Stage 2 network,
# loss, and training loop, mirroring the stage-1 blocks' structure exactly.
stage2:
  network:
    n_hidden_layers: 6
    n_neurons: 64
    activation: tanh
    hard_bc: true              # true: all 4 outputs hard-BC'd (softplus-shifted); false: soft penalty
    hard_pressure_bc: true     # only consulted when hard_bc: false (Hong et al. 2023, Sec 6)

  loss:
    weighting: annealing
    anneal_every: 500
    anneal_alpha: 0.9
    anneal_warmup: 500
    lambda_cont: 1.0
    lambda_mom: 1.0
    lambda_energy: 1.0
    lambda_eos: 1.0
    lambda_bc: 1.0
    lambda_mom_boost: false     # if true, lambda_mom is pinned (not annealed) to the value below
    lambda_mom_boost_value: 20.0   # Hong et al. 2023, used "if residuals stall"

  training:
    n_collocation_x: 512
    n_dt_values: 8
    n_boundary: 64
    resample_every: 1000
    adam_epochs: 20000
    adam_lr: 0.001
    lr_decay_gamma: 0.95
    lr_decay_every: 2000
    log_every: 100
    validate_every: 500
    checkpoint_every: 5000
    lbfgs_max_iter: 5000
    lbfgs_history_size: 50
    held_out_dt: [0.225, 0.275, 0.325, 0.375, 0.425]   # [m], never trained on

  acceptance:
    rel_l2: 1.0e-2             # CLAUDE.md Section 6: "Gate: rel-L2 < 1e-2" (subsonic branch)
